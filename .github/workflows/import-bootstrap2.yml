name: Import clean v0.9.0 candidate source

on:
  push:
    branches: [v0.9.0-mainnet-candidate]
    paths:
      - 'bootstrap2/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-mainnet-candidate
          fetch-depth: 0

      - name: Reconstruct and import tested candidate source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap2/chunk*.b64 | base64 --decode > /tmp/gamecoin-v090-text.tar.xz
          mkdir -p /tmp/gamecoin-v090-text
          tar -xJf /tmp/gamecoin-v090-text.tar.xz -C /tmp/gamecoin-v090-text
          test -f /tmp/gamecoin-v090-text/node.py
          test -f /tmp/gamecoin-v090-text/wallet.py
          test -f /tmp/gamecoin-v090-text/wallet_gui.py
          test -f /tmp/gamecoin-v090-text/miner.py
          rsync -a /tmp/gamecoin-v090-text/ ./
          rm -rf bootstrap bootstrap2
          rm -f IMPORT_STATUS.md
          rm -f .github/workflows/bootstrap-candidate-import.yml
          rm -f .github/workflows/import-bootstrap2.yml
          test -f node.py
          test -f wallet.py
          test -f wallet_gui.py
          test -f miner.py
          test -f gamecoin/chainwork.py
          test -f gamecoin/time_rules.py
          test -f gamecoin/transaction_rules.py

      - name: Install dependencies
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run candidate tests
        shell: bash
        run: python3 -m unittest discover -s tests -v

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import tested GameCoin v0.9.0 Public Testnet v3 candidate source'
          git push origin HEAD:v0.9.0-mainnet-candidate
