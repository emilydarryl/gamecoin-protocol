name: Import v1.0.0 open-source tree

on:
  push:
    branches: [bootstrap-opensource-import]
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap chunks
        uses: actions/checkout@v4
        with:
          ref: bootstrap-opensource-import
          path: bootstrap-src

      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: open-source-v1.0.0
          fetch-depth: 0
          path: target

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap-src/bootstrap/chunk*.b64 | base64 --decode > /tmp/gamecoin-opensource-tree.tar.xz
          echo '062145c43b4abb89d1d931e01cda434cfc70c8af41dd4e8b43ffa68fe4e73468  /tmp/gamecoin-opensource-tree.tar.xz' | sha256sum -c -
          mkdir -p /tmp/gamecoin-source
          tar -xJf /tmp/gamecoin-opensource-tree.tar.xz -C /tmp/gamecoin-source

      - name: Replace staging tree and verify
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git rm -r --ignore-unmatch .
          cp -a /tmp/gamecoin-source/. .
          python3 build_tools/restore_assets.py
          python3 -m unittest discover -s tests -v
          rm -f assets/gamecoin_protocol_full.png assets/gamecoin_protocol_mark.png assets/gamecoin_protocol_mark.ico
          git add -A
          git status --short

      - name: Commit v1.0.0 open-source tree
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare GameCoin v1.0.0 mainnet open-source release'
          git push origin HEAD:open-source-v1.0.0
