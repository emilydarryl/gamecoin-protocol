name: GameCoin CI

on:
  push:
    branches:
      - main
      - open-source-v1.0.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-tests:
    name: Linux tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r build_tools/requirements-build.txt

      - name: Render deterministic build assets
        run: python3 build_tools/render_assets.py

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

  windows-tests:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r build_tools/requirements-build.txt

      - name: Run test suite
        shell: pwsh
        run: python -m unittest discover -s tests -v
