name: Import verified v1.0.0 source tree

on:
  pull_request_target:
    branches: [open-source-v1.0.0]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  import-source:
    if: github.event.pull_request.head.ref == 'bootstrap-opensource-import'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap source branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap-opensource-import
          path: bootstrap-src

      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: open-source-v1.0.0
          fetch-depth: 0
          path: target

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap-src/bootstrap/chunk*.b64 | base64 --decode > /tmp/gamecoin-opensource-tree.tar.xz
          echo '67ad7d6c7723f1dd722970c275890dd09202e183ced36a7760978dcf9739fd36  /tmp/gamecoin-opensource-tree.tar.xz' | sha256sum -c -
          mkdir -p /tmp/gamecoin-source
          tar -xJf /tmp/gamecoin-opensource-tree.tar.xz -C /tmp/gamecoin-source

      - name: Replace staging tree and run tests
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git rm -r --ignore-unmatch .
          cp -a /tmp/gamecoin-source/. .
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r build_tools/requirements-build.txt
          python3 build_tools/render_assets.py
          python3 -m unittest discover -s tests -v
          rm -f assets/gamecoin_protocol_full.png assets/gamecoin_protocol_mark.png assets/gamecoin_protocol_mark.ico
          git add -A

      - name: Commit verified v1.0.0 tree
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare GameCoin v1.0.0 mainnet open-source release'
          git push origin HEAD:open-source-v1.0.0
