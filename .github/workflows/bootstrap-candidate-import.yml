name: Bootstrap v0.9.0 candidate source import

on:
  push:
    branches:
      - v0.9.0-mainnet-candidate
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-mainnet-candidate
          fetch-depth: 0
      - name: Reconstruct candidate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk*.b64 | base64 --decode > /tmp/gamecoin-v090.tar.xz
          mkdir -p /tmp/gamecoin-import
          tar -xJf /tmp/gamecoin-v090.tar.xz -C /tmp/gamecoin-import
          rsync -a --delete-excluded --exclude '.git/' --exclude 'bootstrap/' --exclude '.github/workflows/bootstrap-candidate-import.yml' /tmp/gamecoin-import/ ./
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-candidate-import.yml IMPORT_STATUS.md
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GameCoin Candidate Import'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Import full v0.9.0 Public Testnet v3 candidate source'
          git push origin HEAD:v0.9.0-mainnet-candidate
