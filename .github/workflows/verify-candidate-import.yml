name: Verify candidate source import

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  verify-candidate:
    if: >-
      github.event.issue.number == 2 &&
      github.event.comment.body == '/verify-candidate-source' &&
      github.actor == 'emilydarryl'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-mainnet-candidate
          fetch-depth: 0

      - name: Import staged archive if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -d bootstrap ]; then
            cat bootstrap/chunk*.b64 | base64 --decode > /tmp/gamecoin-v090.tar.xz
            mkdir -p /tmp/gamecoin-v090
            tar -xJf /tmp/gamecoin-v090.tar.xz -C /tmp/gamecoin-v090
            test -f /tmp/gamecoin-v090/node.py
            test -f /tmp/gamecoin-v090/wallet_gui.py
            test -f /tmp/gamecoin-v090/gamecoin/consensus.py
            rsync -a /tmp/gamecoin-v090/ ./
            rm -rf bootstrap
            rm -f .github/workflows/bootstrap-candidate-import.yml
            rm -f IMPORT_STATUS.md
          fi
          test -f node.py
          test -f wallet.py
          test -f wallet_gui.py
          test -f miner.py
          test -f gamecoin/consensus.py
          test -f gamecoin/chainwork.py
          test -f gamecoin/time_rules.py
          test -f gamecoin/transaction_rules.py
          test -d tests

      - name: Install Python requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi

      - name: Run candidate tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Commit source import if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Candidate source is already imported; verification passed.'
          else
            git commit -m 'Import GameCoin v0.9.0 Public Testnet v3 candidate source'
            git pull --rebase origin v0.9.0-mainnet-candidate
            git push origin HEAD:v0.9.0-mainnet-candidate
          fi
